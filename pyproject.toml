[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autosec-soc-defender"
version = "1.0.0"
description = "Reinforcement Learning Agent for Autonomous SOC Operations."
authors = [
    { name = "AutoSec Open Source" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.6",
    "openai>=1.59.9",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "numpy>=1.24.0",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.2.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.2"
]

[project.scripts]
autosec-defender = "inference:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autosec_openenv*", "backend*"]
